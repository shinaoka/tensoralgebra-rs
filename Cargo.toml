[workspace]
resolver = "2"
members = [
    "crates/tprims-kernel",
    "crates/tprims-exec",
    "crates/tprims-core",
    "crates/tprims-contract",
    "crates/tprims-testkit",
    "crates/tprims-bundle",
    "tensorprimitives/crates/tensorprimitives-tapp",
]
exclude = ["experiments"]

[workspace.package]
edition = "2021"
# 1.89 stabilised the AVX-512 intrinsics and `is_x86_feature_detected!`, which
# tensorcontract needs (tensorprimitives-rs decision D20).
rust-version = "1.89"

[workspace.dependencies]
# strided-rs v0.4.4 release commit (tag v0.4.4), spelled exactly as in
# tenferro-rs so both resolve one strided-rs source and share `StridedView`.
strided-basic = { git = "https://github.com/tensor4all/strided-rs.git", rev = "25705339d45583f5eb77bdbde22f2349b48e3f95", version = "0.4.4", default-features = false }
strided-view = { git = "https://github.com/tensor4all/strided-rs.git", rev = "25705339d45583f5eb77bdbde22f2349b48e3f95", version = "0.4.4" }
strided-perm = { git = "https://github.com/tensor4all/strided-rs.git", rev = "25705339d45583f5eb77bdbde22f2349b48e3f95", version = "0.4.4" }
strided-kernel = { git = "https://github.com/tensor4all/strided-rs.git", rev = "25705339d45583f5eb77bdbde22f2349b48e3f95", version = "0.4.4" }
tprims-kernel = { version = "0.1.0", path = "crates/tprims-kernel", default-features = false }
tensorprimitives-tapp = { version = "0.1.0", path = "tensorprimitives/crates/tensorprimitives-tapp" }
tprims-exec = { version = "0.1.0", path = "crates/tprims-exec" }
tprims-core = { version = "0.1.0", path = "crates/tprims-core" }
tprims-testkit = { version = "0.1.0", path = "crates/tprims-testkit" }
tprims-contract = { version = "0.1.0", path = "crates/tprims-contract" }

approx = "0.5"
criterion = "0.5"
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
faer-traits = "0.24"
num-complex = "0.4"
num-traits = "0.2"
pulp = "0.22"
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
smallvec = "1"
thiserror = "1.0"

# Workspace tests instantiate large generic kernels in many executables.
# Omitting debuginfo keeps those artifacts small while preserving debug
# assertions and overflow checks from Cargo's default development profiles.
[profile.dev]
debug = 0

[profile.test]
debug = 0

# Hosted CI starts from cold caches, where incremental state has no value.
[profile.ci]
inherits = "test"
incremental = false
strip = "symbols"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"

[profile.release-with-debug]
inherits = "release"
debug = true

# These two lints fire on index-driven numerical kernels and wide kernel
# signatures, where the suggested rewrites change loop structure in hot paths;
# they stay allowed workspace-wide rather than being "fixed" without a
# benchmark.
[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
# New in clippy 1.98: suggests `as_chunks` for constant-size `chunks_exact` in
# hot reduction loops; rewriting them needs a benchmark first.
chunks_exact_to_as_chunks = "allow"
