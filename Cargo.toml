[workspace]
resolver = "2"
members = [
    # One crate per primitive, named for its operation; `tensortranspose` joins
    # when it exists. There is deliberately no `tensorprimitives` facade crate
    # yet — with one primitive it would be indirection, and adding it later is
    # purely additive (D34).
    "crates/tensorcontract",
    "crates/tensorprimitives-tapp",
    "crates/tensorprimitives-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89 stabilised the AVX-512 intrinsics and `is_x86_feature_detected!` (D20),
# and that is the whole floor. It briefly was not: `kernel::cache` called
# `core::arch::__cpuid_count` outside an `unsafe` block on the strength of a
# comment claiming it had been safe since 1.87. It had not — 1.89 through 1.93
# fail with E0133 and 1.94 is the first that compiles — so the real floor was
# silently 1.94 for as long as that stood. The fix was the `unsafe` block
# (`kernel/cache.rs`, with `allow(unused_unsafe)` for toolchains where it is
# redundant), not five releases of downstream compatibility; see D31. The MSRV
# job in CI pins exactly 1.89, so neither direction of drift is possible again.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lkdvos/tensorprimitives-rs"
authors = ["Lukas Devos <ldevos@flatironinstitute.org>"]

[workspace.dependencies]
num-complex = { version = "0.4", default-features = false, features = ["std"] }
tensorcontract = { path = "crates/tensorcontract", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
