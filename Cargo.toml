[workspace]
resolver = "2"
members = [
    # One crate per primitive, named for its operation; `tensortranspose` joins
    # when it exists. There is deliberately no `tensorprimitives` facade crate
    # yet — with one primitive it would be indirection, and adding it later is
    # purely additive (D34).
    "crates/tensorcontract",
    "crates/tensorprimitives-tapp",
    "crates/tensorprimitives-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89 stabilised the AVX-512 intrinsics and `is_x86_feature_detected!` (D20).
# CI pins exactly this version, so the floor cannot drift in either direction.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lkdvos/tensorprimitives-rs"
# The same URL as `repository`, because the project has no separate site. It is
# set rather than omitted because it is the one field on the API guidelines'
# C-METADATA list that was missing, and crates.io renders it as its own link.
homepage = "https://github.com/lkdvos/tensorprimitives-rs"
authors = ["Lukas Devos <ldevos@flatironinstitute.org>"]

[workspace.dependencies]
num-complex = { version = "0.4", default-features = false, features = ["std"] }
tensorcontract = { path = "crates/tensorcontract", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.bench]
inherits = "release"
