[package]
name = "tprims-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish = false
description = "Benchmarks for the tprims stack"

[lib]
path = "src/lib.rs"
bench = false

[dependencies]
tprims-exec = { workspace = true, features = ["strided"] }
tprims-blas = { workspace = true }
tprims-linalg = { workspace = true }
tprims-contract = { workspace = true }
tprims-core = { workspace = true }
strided-basic = { workspace = true }
tensorcontract = { workspace = true }
strided-view = { workspace = true }
num-complex = { workspace = true }
num-traits = { workspace = true }
rayon = { workspace = true }

[[bin]]
name = "capi_rust"
path = "benchmarks/tprims/capi_rust.rs"

[[bin]]
name = "linalg"
path = "benchmarks/tprims/linalg/linalg.rs"

[[bin]]
name = "contract"
path = "benchmarks/tprims/contract/contract.rs"

[[bin]]
name = "blas"
path = "benchmarks/tprims/blas/blas.rs"

[[bin]]
name = "exec_entry"
path = "benchmarks/tprims/exec_entry/exec_entry.rs"

[lints]
workspace = true
