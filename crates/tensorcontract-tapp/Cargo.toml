[package]
name = "tensorcontract-tapp"
description = "TAPP (Tensor Algebra Processing Primitives) C-ABI front end for tensorcontract"
keywords = ["tensor", "contraction", "tapp", "ffi", "abi"]
categories = ["mathematics", "science", "external-ffi-bindings"]
readme = "../../README.md"
documentation = "https://docs.rs/tensorcontract-tapp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "tensorcontract_tapp"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
tensorcontract.workspace = true
num-complex.workspace = true

[package.metadata.docs.rs]
all-features = true
# The engine underneath is x86-vectorised, so document the same single target it
# does rather than a host where only the scalar path exists.
targets = ["x86_64-unknown-linux-gnu"]
