[package]
name = "tprims-kernel-gemm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "Adapter exposing gemm-f64/gemm-f32 public microkernels as tprims Direct kernel families"

[features]
default = ["std"]
std = ["tprims-gemm-kernel/std"]
# AVX-512 microkernels in gemm-f64/gemm-f32 need their own feature upstream.
x86-v4 = ["gemm-f64/x86-v4", "gemm-f32/x86-v4"]

[dependencies]
# Pinned exactly: the microkernel module is undocumented upstream, so a minor
# bump has to be re-checked (see docs/provenance.md and issue #23).
gemm-common = "=0.19.0"
gemm-f32 = { version = "=0.19.0", default-features = false, features = ["std"] }
gemm-f64 = { version = "=0.19.0", default-features = false, features = ["std"] }
tprims-gemm-kernel = { workspace = true, default-features = false }

[lints]
workspace = true
