[package]
name = "tprims-blas"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "BLAS-like operations for the tprims stack on explicit execution contexts: GEMM, batched GEMM (faer loop or TBLIS-style), TRSM"

[dependencies]
faer = { workspace = true }
num-complex = { workspace = true }
strided-view = { workspace = true }
tensorcontract = { workspace = true }
thiserror = { workspace = true }
tprims-exec = { workspace = true }
tprims-gemm-kernel = { workspace = true, default-features = false }
tprims-kernel-tensorcontract = { workspace = true }
tprims-kernel-gemm = { workspace = true, optional = true }
tprims-kernel-pgx86 = { workspace = true, optional = true }

[features]
default = ["std"]
std = ["tprims-gemm-kernel/std", "tensorcontract/std"]
# The gemm-f64/f32 and private-gemm-x86 providers, off by default so a bare
# build keeps the compiled tensorcontract menu as its only registered set.
kernel-gemm = ["dep:tprims-kernel-gemm"]
kernel-pgx86 = ["dep:tprims-kernel-pgx86"]

[dev-dependencies]
rayon = { workspace = true }
num-complex = { workspace = true }

[lints]
workspace = true
