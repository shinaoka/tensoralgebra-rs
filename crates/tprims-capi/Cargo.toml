[package]
name = "tprims-capi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors = ["Lukas Devos <ldevos@flatironinstitute.org>", "tprims contributors"]
publish = false
description = "libtprims: the TAPP contraction C ABI and the tprims extensions (DLPack, status, executors), as a shared, static and Rust library"
readme = "README.md"

[lib]
name = "tprims"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
num-complex = { workspace = true }
rayon = { workspace = true }
strided-view = { workspace = true }
tprims-contract = { workspace = true }
tprims-exec = { workspace = true }

[dev-dependencies]
tprims-kernel = { workspace = true }
tprims-testkit = { workspace = true }

[lints]
workspace = true
