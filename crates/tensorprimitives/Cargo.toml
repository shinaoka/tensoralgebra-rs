[package]
name = "tensorprimitives"
description = "Dense tensor primitives: transpose-free contraction, with more to come"
keywords = ["tensor", "contraction", "gemm", "complex", "blis"]
categories = ["mathematics", "science"]
readme = "../../README.md"
documentation = "https://docs.rs/tensorprimitives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
tensorcontract = { workspace = true, optional = true }

[features]
# `contract` is the only operation implemented so far, so it is on by default and
# turning it off leaves an empty crate. It is a feature rather than an
# unconditional dependency because the point of this crate is that a caller who
# wants one primitive should not compile the others — which only starts mattering
# when `tensortranspose` exists, and would be a breaking change to introduce then.
default = ["contract", "std"]
contract = ["dep:tensorcontract"]
std = ["tensorcontract?/std"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
