[package]
name = "tprims-custom-kernel-test"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "A downstream crate with its own packed GEMM kernels, exercising the custom-selector API without touching tprims or its global registry"

[dependencies]
tprims-gemm-kernel = { workspace = true, default-features = false, features = ["std"] }

[dev-dependencies]
num-complex = { workspace = true }
rayon = { workspace = true }
strided-view = { workspace = true }
tensorcontract = { workspace = true }
tprims-blas = { workspace = true }
tprims-contract = { workspace = true }
tprims-exec = { workspace = true }

[lints]
workspace = true
