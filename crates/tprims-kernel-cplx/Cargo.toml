[package]
name = "tprims-kernel-cplx"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "Native interleaved complex microkernel families (AVX2+FMA) for the packed driver, opt-in"

[features]
default = ["std"]
std = ["tprims-gemm-kernel/std"]

[dependencies]
tprims-gemm-kernel = { workspace = true, default-features = false }

[dev-dependencies]
libc = "0.2"
num-complex = { workspace = true }
tensorcontract = { path = "../../tensorprimitives/crates/tensorcontract", default-features = false }

[lints]
workspace = true
