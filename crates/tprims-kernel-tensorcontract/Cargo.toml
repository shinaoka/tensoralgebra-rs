[package]
name = "tprims-kernel-tensorcontract"
description = "Lukas Devos's scalar and SIMD GEMM microkernels"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors = ["Lukas Devos <ldevos@flatironinstitute.org>"]
publish = false

[dependencies]
tprims-gemm-kernel.workspace = true

[dev-dependencies]
# The existing custom-scalar doctest exercises the downstream driver.
# Path-only cross-layer test dependency; not a runtime driver dependency.
tensorcontract = { path = "../../tensorprimitives/crates/tensorcontract", default-features = false }

[features]
default = ["std"]
std = ["tprims-gemm-kernel/std"]

[lints]
workspace = true
