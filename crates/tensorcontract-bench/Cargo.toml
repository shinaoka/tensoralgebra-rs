[package]
name = "tensorcontract-bench"
description = "Benchmark and correctness harness for tensorcontract (not published)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
tensorcontract.workspace = true
num-complex.workspace = true
rand = "0.8"
rand_chacha = "0.3"

[features]
default = []
# Link the C++ TBLIS baseline. Requires TBLIS_ROOT to point at an install
# prefix containing lib/libtblis.{so,a}.
tblis = []
# Link a CBLAS-compatible BLAS for the TTGT (transpose-transpose-GEMM-transpose)
# baseline. Requires BLAS_ROOT or a system libopenblas.
blas = []

[[bin]]
name = "tcbench"
path = "src/main.rs"
