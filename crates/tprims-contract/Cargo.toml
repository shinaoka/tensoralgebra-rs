[package]
name = "tprims-contract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "Binary tensor contraction with batch indices for the tprims stack: permute plus batched GEMM, or TBLIS-style direct"

[dependencies]
strided-basic = { workspace = true }
strided-view = { workspace = true }
tensorcontract = { workspace = true }
thiserror = { workspace = true }
tprims-blas = { workspace = true }
tprims-contract-traits = { workspace = true }
tprims-exec = { workspace = true, features = ["strided"] }
tprims-kernel = { workspace = true, default-features = false }

[dev-dependencies]
tprims-contract-testkit = { workspace = true }
num-complex = { workspace = true }
rayon = { workspace = true }

[lints]
workspace = true
