[package]
name = "tprims-contract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors = ["Lukas Devos <ldevos@flatironinstitute.org>", "tprims contributors"]
publish = false
description = "Binary tensor contraction for the tprims stack: one Problem, a packed TBLIS-style driver, faer and elementwise strategies"

[dependencies]
faer = { workspace = true }
num-complex = { workspace = true }
strided-basic = { workspace = true }
strided-view = { workspace = true }
thiserror = { workspace = true }
tprims-exec = { workspace = true, features = ["strided"] }
tprims-kernel = { workspace = true, default-features = false }

[dev-dependencies]
rand = { workspace = true }
rand_chacha = "0.3"
rayon = { workspace = true }

[lints]
workspace = true
