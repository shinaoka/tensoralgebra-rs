[package]
name = "strided-basic"
version = "0.4.4"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
authors = ["Satoshi Terasaki", "Hiroshi Shinaoka"]
repository = "https://github.com/tensor4all/strided-rs"
readme = "README.md"
documentation = "https://docs.rs/strided-basic"
homepage = "https://github.com/tensor4all/strided-rs"
description = "Shared typed strided CPU primitives and copy/reduction execution."
keywords = ["tensor", "strided", "kernels", "numerical"]
categories = ["science", "mathematics", "algorithms"]

[dependencies]
strided-view.workspace = true
strided-perm.workspace = true
num-traits.workspace = true
num-complex.workspace = true
rayon = { workspace = true, optional = true }
smallvec = { workspace = true, optional = true }
pulp = { workspace = true, optional = true }
tprims-exec = { workspace = true, optional = true }

[features]
default = ["simd"]
parallel = ["dep:rayon", "dep:smallvec", "strided-perm/parallel"]
simd = ["dep:pulp"]
# Run strided kernels on a tprims-exec context (`run_with_exec`); tprims addition.
tprims-exec = ["parallel", "dep:tprims-exec"]

[dev-dependencies]
criterion.workspace = true
approx.workspace = true
rand.workspace = true
rand_distr.workspace = true
num-complex.workspace = true

[lib]
bench = false

[lints]
workspace = true
