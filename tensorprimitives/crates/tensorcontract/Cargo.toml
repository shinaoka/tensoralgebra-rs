[package]
name = "tensorcontract"
description = "Transpose-free dense tensor contraction with planar-complex packing"
keywords = ["tensor", "contraction", "gemm", "complex", "blis"]
categories = ["mathematics", "science"]
# The workspace README is the crate README: this crate is the workspace's
# subject, and cargo copies an out-of-root readme into the package.
readme = "../../README.md"
documentation = "https://docs.rs/tensorcontract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/lkdvos/tensorprimitives-rs"
homepage = "https://github.com/lkdvos/tensorprimitives-rs"
authors = ["Lukas Devos <ldevos@flatironinstitute.org>"]

[dependencies]
num-complex.workspace = true

[features]
default = ["std"]
# Gates the standard-library conveniences: the environment-variable overrides
# (`TENSORCONTRACT_*`), the cache-descriptor probe's sysfs source, and the
# `OnceLock` caches behind them. Turning it off compiles and keeps every default
# reachable in code, but it does **not** yet produce a `no_std` build -- the
# crate has no `#![no_std]` and uses `Vec` for the scatter vectors. Treat this as
# the seam a future `no_std` port would widen, not as a claim of one.
std = []

[dev-dependencies]
rand = "0.8"
rand_chacha = "0.3"

[package.metadata.docs.rs]
# Document every feature, so `std`-gated items are not silently missing.
all-features = true
# One target on purpose, and no longer for the reason first recorded here. The
# original rationale was that the vectorised kernels were x86 only, so x86 was
# the one target whose documentation showed the whole crate; the NEON kernels in
# `kernel::aarch64` ended that, and no single target shows both ISA modules now.
# What makes the choice moot is that both are `#[doc(hidden)]`, so neither
# renders on any target and the doc-visible surface is target-independent.
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
